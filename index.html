<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absensi Lavensia</title>
<style>
:root{
  --hutan:#1E3B2F; --daun:#4C7A5E; --kelopak:#E9B7BF; --bunga:#C2566B;
  --latar:#FBF3F2; --kertas:#FFFFFF; --tinta:#25302B; --redam:#6C7A73; --garis:#E7D9D8;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--latar);color:var(--tinta);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.atas{background:var(--hutan);color:#fff;padding:calc(22px + env(safe-area-inset-top)) 22px 64px}
.merek{font-family:Georgia,"Times New Roman",serif;font-size:20px;letter-spacing:.3px;color:var(--kelopak)}
.jam{font-family:Georgia,serif;font-size:60px;line-height:1.05;margin-top:14px;font-variant-numeric:tabular-nums}
.tgl{margin-top:4px;color:#CFE0D6;font-size:15px}
main{max-width:480px;margin:-40px auto 0;padding:0 16px 32px}
.kartu{background:var(--kertas);border-radius:18px;padding:18px;box-shadow:0 6px 24px rgba(30,59,47,.10)}
.mode{display:grid;grid-template-columns:1fr 1fr;background:var(--latar);border-radius:12px;padding:4px;gap:4px}
.mode button{border:0;background:transparent;padding:12px;border-radius:9px;font-size:16px;font-weight:600;color:var(--redam)}
.mode button.aktif{background:var(--hutan);color:#fff}
.judul{display:block;font-size:14px;color:var(--redam);margin:18px 0 8px}
#pilihNama{width:100%;padding:14px;border:1.5px solid var(--garis);border-radius:12px;font-size:16px;font-weight:600;background:#fff;color:var(--tinta)}
#pilihNama:focus-visible{outline:3px solid var(--kelopak)}
.nama button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;padding:13px 14px;border:1.5px solid var(--garis);border-radius:12px;background:#fff;font-size:15px;font-weight:600;color:var(--tinta)}
.nama button.pilih{border-color:var(--hutan);background:#EEF5F0}
.nama .st{flex:none;font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--latar);color:var(--redam)}
.st.masuk{background:#E3F1E8;color:#1E5136}
.st.selesai{background:#E6E8F5;color:#2F3A7A}
.st.cuti{background:#FBE3E6;color:#8E2A3C}
button:focus-visible,input:focus-visible{outline:3px solid var(--kelopak)}
.info{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--latar);font-size:15px}
.foto{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;width:100%;aspect-ratio:4/3;border:2px dashed var(--kelopak);border-radius:14px;background:var(--latar);color:var(--bunga);font-weight:600;overflow:hidden;cursor:pointer;position:relative}
.foto small{color:var(--redam);font-weight:400}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#ambilFoto{display:none}
.tanggal{display:block}
.tanggal label{font-size:13px;color:var(--redam)}
.tanggal input{width:100%;margin-top:4px;padding:12px;border:1.5px solid var(--garis);border-radius:12px;font-size:16px;background:#fff;color:var(--tinta)}
.lokasi{margin-top:14px;font-size:14px;color:var(--redam)}
.lokasi.ok{color:var(--daun)} .lokasi.gagal{color:var(--bunga)}
.kirim{margin-top:18px;width:100%;border:0;border-radius:14px;padding:17px;font-size:18px;font-weight:700;background:var(--bunga);color:#fff}
.kirim:disabled{opacity:.5}
.pesan{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:15px;display:none}
.pesan.ok{display:block;background:#E3F1E8;color:#1E5136}
.pesan.err{display:block;background:#FBE3E6;color:#8E2A3C}
h2{font-family:Georgia,serif;font-weight:normal;font-size:19px;margin:26px 4px 10px}
.baris{display:flex;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid var(--garis);font-size:15px}
.baris:last-child{border-bottom:0}
.baris .w{color:var(--redam);font-variant-numeric:tabular-nums;text-align:right;flex:none}
.kosong{color:var(--redam);font-size:14px;padding:8px 4px}
.hidden{display:none}
</style>
</head>
<body>
<header class="atas">
  <div class="merek">Lavensia Florist</div>
  <div class="jam" id="jam">--:--</div>
  <div class="tgl" id="tgl"></div>
</header>

<main>
  <section class="kartu">
    <div class="mode">
      <button id="tabAbsen" class="aktif" type="button">Absen</button>
      <button id="tabCuti" type="button">Cuti</button>
    </div>

    <span class="judul">Pilih nama</span>
    <select id="pilihNama"></select>

    <!-- Absen -->
    <div id="panelAbsen">
      <div class="info hidden" id="info"></div>
      <span class="judul">Foto selfie</span>
      <label class="foto" for="ambilFoto" id="kotakFoto">
        <span>Ketuk untuk foto selfie</span>
        <small>Kamera depan akan terbuka</small>
      </label>
      <input id="ambilFoto" type="file" accept="image/*" capture="user">
      <div class="lokasi" id="lokasi">Lokasi akan dicek saat kirim.</div>
      <button class="kirim" id="kirimAbsen" type="button" disabled>Pilih nama dulu</button>
    </div>

    <!-- Cuti -->
    <div id="panelCuti" class="hidden">
      <div class="info hidden" id="infoCuti"></div>
      <div class="tanggal" style="margin-top:14px">
        <label>Tanggal<input type="date" id="tglCuti"></label>
      </div>
      <button class="kirim" id="kirimCuti" type="button" disabled>Pilih nama dulu</button>
    </div>

    <div class="pesan" id="pesan"></div>
  </section>

  <h2>Hari ini</h2>
  <section class="kartu" id="hariIni"><div class="kosong">Memuat…</div></section>
</main>

<script>
const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbwK4JxWSGq4K843Tmo6499HKDSjN5FAf0O0Sk4ifbKNrycDwwDKqoIITNJSqYN-T02e/exec';
const KUNCI = 'absen';
const DAFTAR_NAMA = [
  'INTAN NURAINI PUTRI SUDRAJAT',
  'ALFIA RINJANI',
  'TRI RISKA DEWI',
  'CHANTIKA NOVI DEVANTI'
];

const $ = id => document.getElementById(id);
let tab = 'absen', terpilih = '', status = null, fotoData = '', sedangKirim = false, baris = [];

/* ---------- jam & tanggal ---------- */
function hariIniStr(){ return new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Jakarta'}); }
function tick(){
  const n = new Date();
  $('jam').textContent = n.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jakarta'}).replace('.',':');
  $('tgl').textContent = n.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Jakarta'});
}
tick(); setInterval(tick, 10000);

function setTanggalCuti(){
  const t = hariIniStr();
  const d = new Date(t + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + 365);
  const maks = d.toISOString().slice(0,10);
  $('tglCuti').min = t; $('tglCuti').max = maks;
  if(!$('tglCuti').value) $('tglCuti').value = t;
}
setTanggalCuti();

/* ---------- tab ---------- */
function setTab(t){
  tab = t;
  $('tabAbsen').classList.toggle('aktif', t==='absen');
  $('tabCuti').classList.toggle('aktif', t==='cuti');
  $('panelAbsen').classList.toggle('hidden', t!=='absen');
  $('panelCuti').classList.toggle('hidden', t!=='cuti');
  $('pesan').className = 'pesan';
  ubahTombol();
}
$('tabAbsen').onclick = () => setTab('absen');
$('tabCuti').onclick = () => setTab('cuti');

/* ---------- daftar nama ---------- */
function statusDariBaris(nama){
  const r = baris.filter(x => x.nama.toLowerCase() === nama.toLowerCase()).pop();
  if(!r) return null;
  if(r.masuk === 'CUTI') return ['cuti','Cuti'];
  if(r.pulang) return ['selesai','Selesai'];
  return ['masuk','Sudah masuk'];
}
function gambarNama(){
  $('pilihNama').innerHTML = '<option value="">Pilih nama…</option>' + DAFTAR_NAMA.map(n => {
    const st = statusDariBaris(n);
    return '<option value="'+n+'"'+(n===terpilih?' selected':'')+'>'+n+(st?'  ('+st[1]+')':'')+'</option>';
  }).join('');
}
$('pilihNama').onchange = e => {
  const n = e.target.value;
  if(!n){ terpilih = ''; status = null; $('info').className = 'info hidden'; $('infoCuti').className = 'info hidden'; ubahTombol(); return; }
  pilihNama(n);
};

async function pilihNama(n){
  terpilih = n; status = null; $('pilihNama').value = n;
  try{ localStorage.setItem('absen_nama', n); }catch(e){}
  ubahTombol();
  $('pesan').className = 'pesan';
  $('infoCuti').className = 'info hidden';
  $('info').className = 'info'; $('info').textContent = 'Mengecek status…';
  try{
    const h = await kirim({aksi:'status', nama:n});
    if(!h.ok) throw new Error(h.error || 'gagal');
    if(terpilih !== n) return;
    status = h;
    let t = '';
    if(h.status==='masuk') t = 'Belum absen hari ini. Kirim akan tercatat sebagai absen masuk.';
    if(h.status==='pulang') t = 'Sudah masuk pukul ' + h.jamMasuk + '. Kirim akan tercatat sebagai absen pulang.';
    if(h.status==='selesai') t = 'Absen hari ini sudah lengkap (masuk ' + (h.jamMasuk||'-') + ', pulang ' + h.jamPulang + ').';
    if(h.status==='cuti') t = 'Hari ini tercatat cuti.';
    $('info').textContent = t;
    $('infoCuti').textContent = 'Cuti terpakai tahun ini: ' + h.cutiTahunIni + ' hari.';
    $('infoCuti').className = 'info';
  }catch(e){
    $('info').textContent = 'Status belum bisa dimuat (' + (e && e.message ? e.message : 'tidak ada koneksi') + '). Pilih nama lagi untuk mencoba ulang.';
  }
  ubahTombol();
}

function ubahTombol(){
  const a = $('kirimAbsen'), c = $('kirimCuti');
  if(sedangKirim) return;
  if(!terpilih){ a.disabled = c.disabled = true; a.textContent = c.textContent = 'Pilih nama dulu'; return; }
  c.disabled = false; c.textContent = 'Ajukan cuti';
  if(!status){ a.disabled = true; a.textContent = 'Memuat status…'; return; }
  if(status.status==='masuk'){ a.disabled = false; a.textContent = 'Kirim absen masuk'; }
  else if(status.status==='pulang'){ a.disabled = false; a.textContent = 'Kirim absen pulang'; }
  else { a.disabled = true; a.textContent = status.status==='cuti' ? 'Hari ini cuti' : 'Absen hari ini sudah lengkap'; }
}

/* ---------- foto ---------- */
$('ambilFoto').onchange = e => {
  const f = e.target.files[0];
  if(!f) return;
  const img = new Image();
  const url = URL.createObjectURL(f);
  img.onload = () => {
    const s = Math.min(1, 720 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    fotoData = c.toDataURL('image/jpeg', 0.7);
    URL.revokeObjectURL(url);
    $('kotakFoto').innerHTML = '<img alt="Foto selfie" src="'+fotoData+'">';
  };
  img.src = url;
};

function ambilLokasi(){
  return new Promise(res => {
    if(!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({lat:p.coords.latitude, lng:p.coords.longitude}),
      () => res(null),
      {enableHighAccuracy:true, timeout:12000, maximumAge:30000}
    );
  });
}

function tampilPesan(teks, jenis){ const p = $('pesan'); p.textContent = teks; p.className = 'pesan ' + jenis; }

async function kirim(post){
  const r = await fetch(URL_SCRIPT, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(Object.assign({kunci:KUNCI}, post))});
  return r.json();
}

/* ---------- kirim absen ---------- */
$('kirimAbsen').onclick = async () => {
  if(!terpilih || !status) return;
  if(!fotoData) return tampilPesan('Ambil foto selfie dulu.', 'err');
  const aksi = status.status;
  sedangKirim = true; $('kirimAbsen').disabled = true; $('kirimAbsen').textContent = 'Mengirim…';
  $('pesan').className = 'pesan';
  $('lokasi').className = 'lokasi'; $('lokasi').textContent = 'Mengecek lokasi…';
  const pos = await ambilLokasi();
  if(pos){ $('lokasi').className = 'lokasi ok'; $('lokasi').textContent = 'Lokasi terdeteksi.'; }
  else { $('lokasi').className = 'lokasi gagal'; $('lokasi').textContent = 'Lokasi tidak terdeteksi. Aktifkan GPS dan izinkan akses lokasi.'; }
  try{
    const h = await kirim({aksi, nama:terpilih, foto:fotoData, lat:pos&&pos.lat, lng:pos&&pos.lng});
    if(h.ok){
      tampilPesan('Absen ' + aksi + ' tercatat pukul ' + h.jam + '. Terima kasih!', 'ok');
      fotoData = ''; $('ambilFoto').value = '';
      $('kotakFoto').innerHTML = '<span>Ketuk untuk foto selfie</span><small>Kamera depan akan terbuka</small>';
      sedangKirim = false;
      await muatHariIni();
      await pilihNama(terpilih);
      return;
    } else tampilPesan(h.error || 'Gagal menyimpan.', 'err');
  }catch(e){ tampilPesan('Tidak bisa terhubung. Cek internet lalu coba lagi.', 'err'); }
  sedangKirim = false; ubahTombol();
};

/* ---------- ajukan cuti ---------- */
$('kirimCuti').onclick = async () => {
  if(!terpilih) return;
  const dari = $('tglCuti').value, sampai = dari;
  if(!dari) return tampilPesan('Pilih tanggal cuti.', 'err');
  sedangKirim = true; $('kirimCuti').disabled = true; $('kirimCuti').textContent = 'Mengirim…';
  $('pesan').className = 'pesan';
  try{
    const h = await kirim({aksi:'cuti', nama:terpilih, dari, sampai});
    if(h.ok){
      tampilPesan('Cuti tanggal ' + dari + ' tercatat. Total cuti tahun ini: ' + h.cutiTahunIni + ' hari.', 'ok');
      sedangKirim = false;
      await muatHariIni();
      await pilihNama(terpilih);
      return;
    } else tampilPesan(h.error || 'Gagal menyimpan.', 'err');
  }catch(e){ tampilPesan('Tidak bisa terhubung. Cek internet lalu coba lagi.', 'err'); }
  sedangKirim = false; ubahTombol();
};

/* ---------- daftar hari ini ---------- */
async function muatHariIni(){
  try{
    const h = await kirim({aksi:'hariini'});
    if(!h.ok) throw 0;
    baris = h.rows;
    $('hariIni').innerHTML = baris.length
      ? baris.map(r => '<div class="baris"><span>'+esc(r.nama)+'</span><span class="w">'+(r.masuk==='CUTI' ? 'Cuti' : 'masuk '+(r.masuk||'-')+' · pulang '+(r.pulang||'-'))+'</span></div>').join('')
      : '<div class="kosong">Belum ada yang absen hari ini.</div>';
  }catch(e){ $('hariIni').innerHTML = '<div class="kosong">Daftar belum bisa dimuat.</div>'; }
  gambarNama();
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

gambarNama();
muatHariIni().then(() => {
  try{ const n = localStorage.getItem('absen_nama'); if(n && DAFTAR_NAMA.indexOf(n) >= 0) pilihNama(n); }catch(e){}
});
</script>
</body>
</html>
